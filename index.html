<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>简单 HTML 页面</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --shadow: 0 18px 45px rgba(37, 99, 235, 0.12);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top, rgba(37, 99, 235, 0.12), transparent 35%),
        var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
    }

    .card {
      width: min(100%, 560px);
      background: var(--card);
      border-radius: var(--radius);
      padding: 40px 32px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 5vw, 2.8rem);
    }

    p {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.7;
      font-size: 1rem;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 14px 24px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: var(--primary);
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    button:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>你好，HTML</h1>
    <p>这是一个简单的单文件页面，你可以直接在浏览器中打开并继续修改内容、颜色和布局。</p>
    <button type="button" onclick="showMessage()">点我一下</button>
  </main>

  <script>
    function showMessage() {
      alert("欢迎使用这个简单的 HTML 页面！");
    }
  </script>
</body>
</html>
